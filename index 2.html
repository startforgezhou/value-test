<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:14px 0}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:13px 16px;width:100%;text-align:left;margin:8px 0}
button:hover{border-color:var(--ac)}
.pri{background:var(--ac2);color:var(--bg);border:0;text-align:center;font-weight:600}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.tag{display:inline-block;font-size:13px;color:var(--ac);border:1px solid var(--ac);border-radius:20px;padding:0 10px}
.big{font-size:56px;font-weight:700;color:var(--ac);line-height:1.1}
.row{display:flex;justify-content:space-between;font-weight:600}
.back{width:auto;display:inline-block;padding:6px 12px;font-size:14px;color:var(--mut)}
</style></head><body><main id="app"></main>

{n:"专业能力",q:["我至少有一项比较擅长、能独立完成的技能。","别人遇到我擅长的问题时，会不会来问我？","如果让我介绍自己，我能说清楚自己最擅长什么。","我能拿出作品、项目结果或具体例子证明自己的能力。","我的证书、经历或作品，能帮助别人相信我的专业水平。","如果换一个工作环境，我现在的技能仍然用得上。"],
